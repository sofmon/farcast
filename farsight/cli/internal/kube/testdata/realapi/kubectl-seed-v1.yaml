# The kubectl variant's seed (docs/runbooks/adr-0023-m2-realapi.md, R7).
# kubectl applies kubectl-seed-v1.yaml, then kubectl-seed-v1b.yaml, with -n
# into the namespace FARCAST_REALAPI_KUBECTL_NAMESPACE names. The real-API
# suite's TestEmulatedSeedMatchesKubectl seeds the same documents itself and
# compares the two. No document names a namespace: kubectl's -n supplies it.
# Marker values only. The two files differ in one label value per document,
# as a second apply of a changed manifest does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seed-fatline
  labels:
    app.kubernetes.io/name: seed-fatline
    app.kubernetes.io/managed-by: farcast
    farcast.sofmon.com/instance: realapi
    realapi.farcast.sofmon.com/seed: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: seed-fatline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-fatline
        app.kubernetes.io/managed-by: farcast
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fatline
          image: registry.invalid/realapi/fatline:marker
          args:
            - --tunnel-listen=:8443
            - --shrike-socket=/run/fatline/shrike.sock
          env:
            - name: FARCAST_NODE
              value: realapi-marker-node
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: shrike-wire
              mountPath: /run/fatline
        - name: shrike
          image: registry.invalid/realapi/shrike:marker
          args:
            - --socket=/run/fatline/shrike.sock
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: shrike-wire
              mountPath: /run/fatline
      volumes:
        - name: shrike-wire
          emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: seed-egress
  labels:
    app.kubernetes.io/name: seed-egress
    app.kubernetes.io/managed-by: farcast
    farcast.sofmon.com/instance: realapi
    realapi.farcast.sofmon.com/seed: v1
stringData:
  FARCAST_FATLINE_PROXY: realapi-marker-proxy
  REALAPI_MARKER: realapi-marker-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-config
  labels:
    app.kubernetes.io/name: seed-config
    app.kubernetes.io/managed-by: farcast
    farcast.sofmon.com/instance: realapi
    realapi.farcast.sofmon.com/seed: v1
data:
  FARCAST_APP_NAME: seed-config
  REALAPI_MARKER: realapi-marker-configmap
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seed-egress
  labels:
    app.kubernetes.io/name: seed-egress
    app.kubernetes.io/managed-by: farcast
    farcast.sofmon.com/instance: realapi
    realapi.farcast.sofmon.com/seed: v1
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seed-fatline
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.0/24
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 198.51.100.0/24
      ports:
        - protocol: TCP
          port: 443
